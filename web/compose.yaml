# Deploy bản server: app (FastAPI + site) phía sau Caddy (HTTPS tự động).
#   SITE_DOMAIN=sai.example.com ADMIN_KEY=... docker compose -f web/compose.yaml up -d --build
# Chạy thử trên máy: SITE_DOMAIN=localhost (Caddy tự cấp chứng chỉ nội bộ).
services:
  app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-}
    volumes:
      - sai-data:/data
      - hf-cache:/cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10.2
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Đặt SITE_DOMAIN, vd. sai.example.com hoặc localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  sai-data:
  hf-cache:
  caddy-data:
  caddy-config:

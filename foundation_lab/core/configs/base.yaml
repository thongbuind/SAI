# Pipeline huấn luyện chuẩn của SAI: pretrain → SFT1 → SFT2. Mỗi cỡ model có file riêng kế thừa file này.
#
# Điểm chưa tốt đã biết (sẽ thành tuỳ chọn ở mốc sau):
# - pretrain/continued tính test loss trên trọng số CUỐI vòng lặp (final_eval: last), không phải best.
# - sft2 trộn lại dữ liệu mỗi epoch (resample_per_epoch: true) làm val/test lọt vào train.
# - SFT1 khởi tạo từ best của PRETRAIN, không qua continued.
description: Pipeline chuẩn pretrain → SFT1 → SFT2.

runtime:
  device: auto
  seed: null            # không đặt seed; đặt số nguyên để run tái lập được
  compile: true
  limited_max_autotune: false
  profile_kernels: false
  profile_vram: false
  num_workers: 1

# Gộp vào params của mọi stage (giá trị riêng của stage được ưu tiên).
stage_defaults:
  batch_size: 64
  accumulation_steps: 1
  max_microbatch_tokens: 16384
  max_grad_norm: 1.0
  loss_chunk_size: 4096
  checkpoint_every_steps: 5000
  lr_schedule: warmup_stable_decay

pipeline:
  pretrain:
    recipe: causal_lm
    data: pretrain
    params:
      epochs: 1
      learning_rate: 2.0e-4
      weight_decay: 0.2
      warmup_ratio: 0.1
      adamw_fused: true
      final_eval: last

  continued:
    # Dữ liệu continued chưa được encode và SFT1 không dùng kết quả của stage này, nên mặc định tắt.
    enabled: false
    recipe: causal_lm
    data: continued_mix
    init: pretrain.best
    params:
      epochs: 5
      learning_rate: 1.5e-5
      weight_decay: 0.1
      warmup_ratio: 0.1
      adamw_fused: true
      final_eval: last

  sft1:
    recipe: sft
    data: sft1
    init: pretrain.best
    params:
      epochs: 4
      learning_rate: 2.0e-5
      weight_decay: 0.05
      warmup_ratio: 0.15
      adamw_fused: null     # chỉ fused khi chạy CUDA
      final_eval: best
      freeze_blocks: []
      resample_per_epoch: false

  sft2:
    recipe: sft
    data: sft2_mix
    init: sft1.best
    params:
      epochs: 5
      learning_rate: 1.0e-5
      weight_decay: 0.05
      warmup_ratio: 0.15
      adamw_fused: null
      final_eval: best
      freeze_blocks: []
      resample_per_epoch: true

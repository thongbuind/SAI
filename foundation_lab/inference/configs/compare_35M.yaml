# So sánh beam search mặc định với greedy và sampling trên SAI 35M (checkpoint SFT1), trên bộ câu hỏi benchmark.
#   python -m foundation_lab infer foundation_lab/inference/configs/compare_35M.yaml
extends: benchmark.yaml
model: SAI_35M
checkpoint: model/sft1_35M.pt
device: auto
variants:
  - name: beam5
    generation: {strategy: beam, beam_size: 5}
  - name: greedy
    generation: {strategy: greedy}
  - name: sample
    generation: {strategy: sample, temperature: 0.8, top_p: 0.95, seed: 0}
